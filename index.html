<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a56db">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Konteyner Foto</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --text:#111827; --muted:#6b7280; --brand:#1a56db; --ok:#15803d; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#1a1d24; --text:#f3f4f6; --muted:#9ca3af; --brand:#60a5fa; --ok:#4ade80; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:16px; display:grid; gap:12px; }
  .card { background:var(--card); border-radius:14px; padding:16px; display:grid; gap:12px; }
  h1 { font-size:20px; margin:0; }
  label { font-size:14px; color:var(--muted); }
  input[type=text], input[type=password] { width:100%; padding:14px; font-size:20px; border:1px solid var(--muted); border-radius:10px; background:var(--bg); color:var(--text); text-transform:uppercase; letter-spacing:1px; }
  input[type=password] { text-transform:none; }
  button, .btn { display:block; width:100%; padding:16px; font-size:18px; font-weight:600; border:0; border-radius:12px; background:var(--brand); color:#fff; text-align:center; }
  button.secondary, .btn.secondary { background:transparent; color:var(--brand); border:2px solid var(--brand); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row .btn { padding:14px 8px; font-size:16px; }
  button:disabled { opacity:.5; }
  .btn.disabled { opacity:.5; pointer-events:none; }
  input[type=file] { display:none; }
  progress { width:100%; height:14px; }
  #selected { font-weight:600; }
  #status { font-weight:600; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  .muted { color:var(--muted); font-size:14px; }
  input.plain { text-transform:none; letter-spacing:0; }
  .userRow { display:grid; gap:8px; padding:12px; border:1px solid var(--muted); border-radius:10px; }
  .userRow .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .userRow button { padding:10px; font-size:15px; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .sheet { background:var(--card); width:100%; max-width:480px; max-height:80vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px; display:grid; gap:10px; }
  .sheet button { padding:14px; font-size:17px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; background:var(--bg); }
  .sheet.tall { max-height:92vh; }
  .big { position:fixed; inset:0; background:#000; z-index:30; display:flex; align-items:center; justify-content:center; color:#fff; }
  .big img { max-width:100%; max-height:100%; }
  #bigMsg { position:absolute; }
  #bigClose { position:absolute; top:12px; right:12px; width:auto; padding:10px 18px; }
  .camTools { position:absolute; left:16px; right:16px; bottom:124px; display:flex; align-items:center; gap:12px; color:#fff; }
  .zoomWrap { display:flex; align-items:center; gap:8px; flex:1; }
  .zoomWrap input { flex:1; }
  #torchBtn { width:auto; padding:8px 14px; font-size:20px; background:rgba(255,255,255,.25); }
  .camera { position:fixed; inset:0; background:#000; z-index:20; touch-action:none; }
  .camera video { width:100%; height:100%; object-fit:contain; }
  #camCount { position:absolute; top:16px; left:0; right:0; text-align:center; color:#fff; font-weight:600; text-shadow:0 1px 4px #000; }
  #shutter { position:absolute; bottom:28px; left:50%; width:76px; height:76px; margin-left:-38px; padding:0; border-radius:50%; background:#fff; border:6px solid rgba(255,255,255,.5); background-clip:padding-box; }
  #camDone { position:absolute; bottom:44px; right:20px; width:auto; padding:12px 22px; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <section id="login" class="card hidden">
    <h1>Giriş</h1>
    <label for="pin">Size verilen PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <button id="loginBtn">Giriş yap</button>
    <div id="loginMsg" class="err"></div>
    <button id="adminOpenBtn" class="secondary">Yönetici girişi</button>
  </section>

  <section id="adminLogin" class="card hidden">
    <h1>Yönetici girişi</h1>
    <label for="adminUser">Kullanıcı adı</label>
    <input id="adminUser" class="plain" type="text" autocapitalize="none" autocomplete="off">
    <label for="adminPass">Şifre</label>
    <input id="adminPass" type="password" autocomplete="off">
    <button id="adminLoginBtn">Giriş yap</button>
    <button id="adminBackBtn" class="secondary">Geri</button>
    <div id="adminLoginMsg" class="err"></div>
  </section>

  <section id="admin" class="card hidden">
    <h1>Yönetici paneli</h1>
    <div id="adminUsers" class="muted">Yükleniyor...</div>
    <label for="newName">Yeni kullanıcı adı</label>
    <input id="newName" class="plain" type="text" autocomplete="off" maxlength="30">
    <label for="newPin">PIN (boş bırakırsanız otomatik, 6-12 rakam)</label>
    <input id="newPin" class="plain" type="text" inputmode="numeric" autocomplete="off" maxlength="12">
    <button id="adminAddBtn">Kullanıcı ekle</button>
    <div id="adminMsg"></div>
    <button id="adminLogoutBtn" class="secondary">Yönetici çıkışı</button>
  </section>

  <section id="app" class="card hidden">
    <h1>Merhaba <span id="who"></span></h1>
    <label for="container">Konteyner numarası</label>
    <input id="container" type="text" autocapitalize="characters" autocomplete="off" placeholder="MSDU6983219" maxlength="32">

    <button id="historyBtn" class="secondary">📁 Yüklenen klasörlerim</button>
    <button id="viewBtn" class="secondary hidden">👁 Klasördeki fotoğrafları gör</button>
    <button id="cameraBtn" class="secondary">📷 Fotoğraf çek</button>
    <div class="row">
      <label class="btn secondary" for="gallery">🖼️ Galeri</label>
      <label class="btn secondary" for="folder">📂 Klasör seç</label>
    </div>
    <input id="folder" type="file" webkitdirectory multiple>
    <input id="gallery" type="file" accept="image/*" multiple>
    <input id="camera" type="file" accept="image/*" capture="environment">

    <div id="selected"></div>
    <button id="sendBtn" class="hidden">Gönder</button>
    <button id="clearBtn" class="secondary hidden">Seçimi temizle</button>

    <progress id="bar" value="0" max="1" class="hidden"></progress>
    <div id="status"></div>
    <button id="retryBtn" class="secondary hidden">Başarısızları tekrar dene</button>
    <div class="muted">Yükleme bitene kadar bu sayfayı açık tutun.</div>
    <button id="logoutBtn" class="secondary">Çıkış</button>
  </section>
</main>

<div id="sheet" class="overlay hidden">
  <div class="sheet">
    <h1>Yüklenen klasörlerim</h1>
    <div id="sheetList" class="muted"></div>
    <button id="sheetClose" class="secondary">Kapat</button>
  </div>
</div>

<div id="viewOverlay" class="overlay hidden">
  <div class="sheet tall">
    <h1 id="viewTitle"></h1>
    <div id="viewMsg" class="muted"></div>
    <div id="viewGrid" class="grid"></div>
    <button id="viewClose" class="secondary">Kapat</button>
  </div>
</div>

<div id="bigOverlay" class="big hidden">
  <img id="bigImg" alt="">
  <div id="bigMsg"></div>
  <button id="bigClose">Kapat</button>
</div>

<div id="cam" class="camera hidden">
  <video id="camVideo" playsinline muted autoplay></video>
  <div id="camCount"></div>
  <div id="camTools" class="camTools hidden">
    <div id="zoomWrap" class="zoomWrap hidden">
      <span>🔍</span>
      <input id="zoomRange" type="range">
      <span id="zoomLabel"></span>
    </div>
    <button id="torchBtn" class="hidden" aria-label="Fener">🔦</button>
  </div>
  <button id="shutter" aria-label="Fotoğraf çek"></button>
  <button id="camDone">Bitti</button>
</div>

<script>
// ---- Ayarlar ----
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQgMh6jhLZgEqGC2DbDXFZ5vrACW_9NAWG6fGQ3VJcXF7SNzLg2JAfJfPsyufD-sGtfQ/exec';
const SCALE = 0.4;          // her kenar: %40 (çözünürlük %60 düşer)
const JPEG_QUALITY = 0.75;
const PARALLEL = 6;         // aynı anda yüklenen fotoğraf
const PREPARE_PARALLEL = 2; // aynı anda küçültülen fotoğraf (telefon belleği için sınırlı)
const RETRIES = 3;
const CAMERA_MAX_SIDE = 1600; // uygulama içi kamerada uzun kenar (galeri fotoğrafları SCALE ile küçülür)
const CONTAINER_PATTERN = /^[A-Z0-9][A-Z0-9_-]{0,31}$/;
const IMAGE_NAME_PATTERN = /\.(jpe?g|png|webp|heic|heif)$/i;

const $ = (id) => document.getElementById(id);
let pin = null;
// Kuyruk öğesi: { id, file (yeniden açılışta null), name, lastModified, size, container, blob (küçültülmüş), prepared }
let queue = [];    // seçilmiş, henüz gönderilmemiş
let failed = [];   // gönderilemeyenler
let busy = false;
let wakeLock = null;

// ---- Kalıcı kuyruk: küçültülen fotoğraflar yüklenene kadar telefonda saklanır ----
const DB_NAME = 'konteyner-foto';
const DB_STORE = 'pending';
const dbPromise = new Promise((resolve) => {
  try {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => request.result.createObjectStore(DB_STORE, { keyPath: 'id' });
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => resolve(null);
  } catch {
    resolve(null);   // depolama kapalıysa uygulama yalnızca bellekte çalışır
  }
});

async function dbRun(mode, work) {
  const db = await dbPromise;
  if (!db) return [];
  return new Promise((resolve) => {
    try {
      const tx = db.transaction(DB_STORE, mode);
      const request = work(tx.objectStore(DB_STORE));
      tx.oncomplete = () => resolve(request?.result || []);
      tx.onerror = tx.onabort = () => resolve([]);
    } catch {
      resolve([]);
    }
  });
}

function persist(item) {
  if (item.removed || !item.blob) return;
  const { id, name, lastModified, size, container, blob } = item;
  dbRun('readwrite', (store) => store.put({ id, name, lastModified, size, container, blob }));
}
function unpersist(item) { dbRun('readwrite', (store) => store.delete(item.id)); }

// ---- Giriş ----
function store(key, value) { try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch {} }
function load(key) { try { return localStorage.getItem(key); } catch { return null; } }

async function callScript(payload) {
  const response = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'content-type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return response.json();
}

async function enter(candidate) {
  const result = await callScript({ action: 'check', pin: candidate });
  if (!result.ok) throw new Error(result.error || 'Giriş başarısız');
  pin = candidate;
  store('pin', candidate);
  $('who').textContent = result.worker;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
}

$('loginBtn').addEventListener('click', async () => {
  $('loginMsg').textContent = '';
  try { await enter($('pin').value.trim()); }
  catch (error) { $('loginMsg').textContent = error.message; }
});

$('logoutBtn').addEventListener('click', () => {
  store('pin', null);
  pin = null;
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
});

// ---- Küçültme (seçer seçmez arka planda başlar) ----
function createLimiter(max) {
  let active = 0;
  const waiting = [];
  return async (task) => {
    if (active >= max) await new Promise((resolve) => waiting.push(resolve));
    active += 1;
    try { return await task(); }
    finally { active -= 1; waiting.shift()?.(); }
  };
}
const prepareLimit = createLimiter(PREPARE_PARALLEL);

async function compress(file) {
  const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const width = Math.max(1, Math.round(bitmap.width * SCALE));
  const height = Math.max(1, Math.round(bitmap.height * SCALE));
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
  bitmap.close();
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', JPEG_QUALITY));
  if (!blob) throw new Error('Fotoğraf küçültülemedi');
  return blob;
}

function toBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

function prepare(item) {
  if (!item.prepared) {
    item.prepared = prepareLimit(async () => {
      if (!item.blob) {
        item.blob = await compress(item.file);
        persist(item);
      }
      return toBase64(item.blob);
    }).catch((error) => {
      item.prepared = null;   // tekrar denemede yeniden hazırlansın
      throw error;
    });
  }
  return item.prepared;
}

// Aynı fotoğraf tekrar seçilirse aynı ad çıkar; Drive tarafı kopya oluşturmaz.
function stableName(container, item) {
  const base = item.name.replace(/\.[^.]+$/, '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || 'foto';
  return `${container}_${item.lastModified}_${base}_${item.size}.jpg`;
}

// ---- Seçim ----
function isImage(file) {
  return file.type.startsWith('image/') || IMAGE_NAME_PATTERN.test(file.name);
}

function fileKey(file) { return `${file.webkitRelativePath || ''}|${file.name}|${file.size}|${file.lastModified}`; }

// Klasör seçiminde fotoğrafın bulunduğu klasörün adı konteyner numarasıdır.
function folderContainer(file) {
  const parts = (file.webkitRelativePath || '').split('/');
  if (parts.length < 2) return null;
  const name = parts[parts.length - 2].toUpperCase().replace(/\s+/g, '');
  return CONTAINER_PATTERN.test(name) ? name : null;
}

function refreshSelection() {
  const hasQueue = queue.length > 0;
  const folderNames = new Set(queue.map((item) => item.container).filter(Boolean));
  $('selected').textContent = !hasQueue
    ? ''
    : folderNames.size > 0
      ? `${queue.length} fotoğraf hazır (${folderNames.size} konteyner klasörü)`
      : `${queue.length} fotoğraf hazır`;
  $('sendBtn').textContent = `Gönder (${queue.length})`;
  $('sendBtn').classList.toggle('hidden', !hasQueue);
  $('clearBtn').classList.toggle('hidden', !hasQueue);
  for (const id of ['sendBtn', 'clearBtn', 'retryBtn', 'logoutBtn', 'container', 'cameraBtn', 'historyBtn', 'viewBtn']) $(id).disabled = busy;
  for (const id of ['gallery', 'folder']) {
    document.querySelector(`label[for=${id}]`).classList.toggle('disabled', busy);
  }
}

function addFiles(fileList) {
  const known = new Set(queue.map((item) => item.id));
  let skipped = 0;
  let unnamedFolder = 0;
  for (const file of fileList) {
    if (!isImage(file)) { skipped += 1; continue; }
    const id = fileKey(file);
    if (known.has(id)) continue;
    known.add(id);
    const container = folderContainer(file);
    if (file.webkitRelativePath && !container) unnamedFolder += 1;
    const item = {
      id, file, name: file.name, lastModified: file.lastModified, size: file.size,
      container, blob: null, prepared: null
    };
    prepare(item).catch(() => {});   // hata gönderirken bildirilir
    queue.push(item);
  }
  const notes = [];
  if (skipped) notes.push(`${skipped} dosya fotoğraf olmadığı için atlandı.`);
  if (unnamedFolder) notes.push(`${unnamedFolder} fotoğrafın klasör adı geçerli bir konteyner numarası değil; bunlar için yukarıdaki kutuya numara yazın.`);
  if (notes.length) {
    $('status').className = 'err';
    $('status').textContent = notes.join(' ');
  }
  refreshSelection();
}

for (const id of ['gallery', 'camera']) {
  $(id).addEventListener('change', (event) => {
    addFiles(Array.from(event.target.files));
    event.target.value = '';
  });
}

$('folder').addEventListener('change', (event) => {
  const files = Array.from(event.target.files);
  event.target.value = '';
  if (files.length > 0 && !files.some((file) => file.webkitRelativePath)) {
    $('status').className = 'err';
    $('status').textContent = 'Bu telefon klasör seçmeyi desteklemiyor. Galeri düğmesini kullanın.';
    return;
  }
  addFiles(files);
});

$('clearBtn').addEventListener('click', () => {
  for (const item of queue) {
    item.removed = true;
    unpersist(item);
  }
  queue = [];
  $('status').textContent = '';
  refreshSelection();
});

// ---- Uygulama içi kamera: ekrandan çıkmadan art arda çekim, her fotoğraf kuyruğa eklenir ----
let camStream = null;
let camCount = 0;
let shotCounter = 0;

function updateCamCount() {
  $('camCount').textContent = `${camCount} fotoğraf çekildi · toplam ${queue.length} hazır`;
}

async function openCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    $('camera').click();   // eski tarayıcı: telefonun kendi kamerası (tek çekim)
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 2560 }, height: { ideal: 1920 } },
      audio: false
    });
  } catch {
    $('status').className = 'err';
    $('status').textContent = 'Kamera açılamadı. Tarayıcıda bu site için kamera iznini açın.';
    return;
  }
  $('camVideo').srcObject = camStream;
  camCount = 0;
  updateCamCount();
  $('cam').classList.remove('hidden');
  $('camVideo').play().catch(() => {});
  setupCameraTools();
}

// Yakınlaştırma ve fener yalnızca telefonun kamerası destekliyorsa görünür.
let camTrack = null;
let zoomLimits = null;
let torchOn = false;
let pinch = null;

function applyCameraConstraint(constraint) {
  camTrack?.applyConstraints({ advanced: [constraint] }).catch(() => {});
}

function showZoom(value) { $('zoomLabel').textContent = `${Number(value).toFixed(1)}×`; }

function setupCameraTools() {
  camTrack = camStream.getVideoTracks()[0];
  const caps = camTrack.getCapabilities?.() || {};
  zoomLimits = caps.zoom ? { min: caps.zoom.min, max: caps.zoom.max } : null;
  torchOn = false;
  $('zoomWrap').classList.toggle('hidden', !zoomLimits);
  $('torchBtn').classList.toggle('hidden', !caps.torch);
  $('camTools').classList.toggle('hidden', !zoomLimits && !caps.torch);
  if (zoomLimits) {
    const range = $('zoomRange');
    range.min = caps.zoom.min;
    range.max = caps.zoom.max;
    range.step = caps.zoom.step || 0.1;
    range.value = camTrack.getSettings().zoom || caps.zoom.min;
    showZoom(range.value);
  }
}

$('zoomRange').addEventListener('input', (event) => {
  showZoom(event.target.value);
  applyCameraConstraint({ zoom: Number(event.target.value) });
});

$('torchBtn').addEventListener('click', () => {
  torchOn = !torchOn;
  $('torchBtn').style.opacity = torchOn ? '1' : '.6';
  applyCameraConstraint({ torch: torchOn });
});

function touchDistance(touches) {
  return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
}

$('camVideo').addEventListener('touchstart', (event) => {
  if (event.touches.length === 2 && zoomLimits) {
    pinch = { distance: touchDistance(event.touches), zoom: Number($('zoomRange').value) };
  }
});
$('camVideo').addEventListener('touchmove', (event) => {
  if (!pinch || event.touches.length !== 2) return;
  event.preventDefault();
  const wanted = pinch.zoom * (touchDistance(event.touches) / pinch.distance);
  const zoom = Math.min(zoomLimits.max, Math.max(zoomLimits.min, wanted));
  $('zoomRange').value = zoom;
  showZoom(zoom);
  applyCameraConstraint({ zoom });
}, { passive: false });
$('camVideo').addEventListener('touchend', () => { pinch = null; });

function closeCamera() {
  camStream?.getTracks().forEach((track) => track.stop());
  camStream = null;
  camTrack = null;
  zoomLimits = null;
  $('camTools').classList.add('hidden');
  $('camVideo').srcObject = null;
  $('cam').classList.add('hidden');
  $('status').textContent = '';
  refreshSelection();
}

function shoot() {
  const video = $('camVideo');
  if (!video.videoWidth) return;
  const ratio = Math.min(1, CAMERA_MAX_SIDE / Math.max(video.videoWidth, video.videoHeight));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(video.videoWidth * ratio);
  canvas.height = Math.round(video.videoHeight * ratio);
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  navigator.vibrate?.(20);
  video.style.opacity = '.3';
  setTimeout(() => { video.style.opacity = ''; }, 80);
  canvas.toBlob((blob) => {
    if (!blob) return;
    shotCounter += 1;
    camCount += 1;
    const now = Date.now();
    const item = {
      id: `kamera|${now}|${shotCounter}`, file: null, name: `kamera${shotCounter}`,
      lastModified: now, size: blob.size, container: null, blob, prepared: null
    };
    queue.push(item);
    persist(item);
    updateCamCount();
  }, 'image/jpeg', JPEG_QUALITY);
}

$('cameraBtn').addEventListener('click', openCamera);
$('shutter').addEventListener('click', shoot);
$('camDone').addEventListener('click', closeCamera);
document.addEventListener('visibilitychange', () => { if (document.hidden && camStream) closeCamera(); });

// ---- Yüklenen klasörlerim: daha önce yüklenen konteynerler, birine dokununca numarası kutuya yazılır ----
function closeSheet() { $('sheet').classList.add('hidden'); }

function formatDate(ms) {
  return new Date(ms).toLocaleString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

async function openHistory() {
  const list = $('sheetList');
  list.textContent = 'Yükleniyor...';
  $('sheet').classList.remove('hidden');
  try {
    const result = await callScript({ action: 'list', pin });
    if (!result.ok) throw new Error(result.error || 'Liste alınamadı');
    const folders = result.folders.filter((folder) => CONTAINER_PATTERN.test(folder.name));
    if (folders.length === 0) {
      list.textContent = 'Henüz yüklenmiş klasör yok.';
      return;
    }
    list.textContent = '';
    for (const folder of folders) {
      const button = document.createElement('button');
      button.className = 'secondary';
      button.textContent = `${folder.name} · ${formatDate(folder.updated)}`;
      button.addEventListener('click', () => {
        $('container').value = folder.name;
        updateViewBtn();
        closeSheet();
        $('status').className = 'ok';
        $('status').textContent = `Klasör seçildi: ${folder.name}. Fotoğraf ekleyip Gönder'e basın.`;
      });
      list.appendChild(button);
    }
  } catch (error) {
    list.textContent = `Liste alınamadı: ${error.message}`;
  }
}

$('historyBtn').addEventListener('click', openHistory);
$('sheetClose').addEventListener('click', closeSheet);

// ---- Klasördeki fotoğrafları görme (yalnızca görüntüleme; silme yok) ----
let viewRun = 0;
let bigRun = 0;

function typedContainer() { return $('container').value.trim().toUpperCase().replace(/\s+/g, ''); }

function updateViewBtn() {
  $('viewBtn').classList.toggle('hidden', !CONTAINER_PATTERN.test(typedContainer()));
}
$('container').addEventListener('input', updateViewBtn);

async function openView() {
  const container = typedContainer();
  const run = ++viewRun;
  $('viewTitle').textContent = container;
  $('viewGrid').textContent = '';
  $('viewMsg').textContent = 'Yükleniyor...';
  $('viewOverlay').classList.remove('hidden');
  try {
    const result = await callScript({ action: 'photos', pin, container });
    if (!result.ok) throw new Error(result.error || 'Liste alınamadı');
    if (run !== viewRun) return;
    const names = result.photos.map((photo) => photo.name);
    if (names.length === 0) {
      $('viewMsg').textContent = 'Bu klasörde henüz fotoğraf yok.';
      return;
    }
    $('viewTitle').textContent = `${container} · ${names.length} fotoğraf`;
    $('viewMsg').textContent = '';

    const images = new Map();
    for (const name of names) {
      const img = document.createElement('img');
      img.alt = '';
      img.addEventListener('click', () => openBig(container, name));
      images.set(name, img);
      $('viewGrid').appendChild(img);
    }

    const batches = [];
    for (let i = 0; i < names.length; i += 8) batches.push(names.slice(i, i + 8));
    let next = 0;
    const loader = async () => {
      while (next < batches.length && run === viewRun) {
        const batch = batches[next++];
        try {
          const thumbs = await callScript({ action: 'thumbs', pin, container, names: batch });
          if (!thumbs.ok) continue;
          for (const thumb of thumbs.thumbs) images.get(thumb.name).src = `data:${thumb.type};base64,${thumb.data}`;
        } catch {
          // bu gruptaki küçük resimler boş kalır
        }
      }
    };
    await Promise.all([loader(), loader()]);
  } catch (error) {
    if (run === viewRun) $('viewMsg').textContent = `Fotoğraflar alınamadı: ${error.message}`;
  }
}

async function openBig(container, name) {
  const run = ++bigRun;
  $('bigImg').removeAttribute('src');
  $('bigMsg').textContent = 'Yükleniyor...';
  $('bigOverlay').classList.remove('hidden');
  try {
    const result = await callScript({ action: 'photo', pin, container, name });
    if (!result.ok) throw new Error(result.error || 'Açılamadı');
    if (run !== bigRun) return;
    $('bigImg').src = `data:${result.type};base64,${result.data}`;
    $('bigMsg').textContent = '';
  } catch (error) {
    if (run === bigRun) $('bigMsg').textContent = `Fotoğraf açılamadı: ${error.message}`;
  }
}

$('viewBtn').addEventListener('click', openView);
$('viewClose').addEventListener('click', () => {
  viewRun += 1;
  $('viewOverlay').classList.add('hidden');
});
$('bigClose').addEventListener('click', () => {
  bigRun += 1;
  $('bigOverlay').classList.add('hidden');
});

// ---- Yükleme ----
async function uploadOne(item) {
  const container = item.container;
  const data = await prepare(item);
  let lastError;
  for (let attempt = 1; attempt <= RETRIES; attempt += 1) {
    try {
      const result = await callScript({ pin, container, filename: stableName(container, item), data });
      if (result.ok) { unpersist(item); return; }
      lastError = new Error(result.error || 'Yükleme reddedildi');
      if (result.error === 'PIN hatalı' || result.error === 'Hesabınız engellendi') break;
    } catch (error) {
      lastError = error;
    }
    await new Promise((resolve) => setTimeout(resolve, 1000 * attempt));
  }
  throw lastError;
}

async function uploadAll(items) {
  const total = items.length;
  let done = 0;
  let nextIndex = 0;
  let lastError = '';
  failed = [];
  busy = true;
  refreshSelection();
  $('retryBtn').classList.add('hidden');
  $('bar').classList.remove('hidden');
  $('bar').max = total;
  $('bar').value = 0;
  $('status').className = '';
  $('status').textContent = `0/${total} yüklendi`;

  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  window.onbeforeunload = () => 'Yükleme sürüyor';

  const worker = async () => {
    while (nextIndex < total) {
      const item = items[nextIndex++];
      try { await uploadOne(item); }
      catch (error) {
        failed.push(item);
        lastError = error.message;
      }
      done += 1;
      $('bar').value = done;
      $('status').textContent = `${done}/${total} yüklendi`;
    }
  };
  await Promise.all(Array.from({ length: Math.min(PARALLEL, total) }, worker));

  window.onbeforeunload = null;
  try { await wakeLock?.release(); } catch {}
  busy = false;

  const okCount = total - failed.length;
  const containers = new Set(items.map((item) => item.container));
  if (failed.length === 0) {
    $('status').className = 'ok';
    $('status').textContent = containers.size === 1
      ? `✅ ${items[0].container}: ${okCount} fotoğraf yüklendi`
      : `✅ ${containers.size} konteyner, ${okCount} fotoğraf yüklendi`;
  } else {
    $('status').className = 'err';
    $('status').textContent = `⚠️ ${total} fotoğraftan ${okCount} tanesi yüklendi, ${failed.length} başarısız. Son hata: ${lastError}`;
    $('retryBtn').classList.remove('hidden');
  }
  refreshSelection();
}

$('sendBtn').addEventListener('click', () => {
  if (busy || queue.length === 0) return;
  const typed = typedContainer();
  const needsTyped = queue.some((item) => !item.container);
  if (needsTyped && !CONTAINER_PATTERN.test(typed)) {
    $('status').className = 'err';
    $('status').textContent = 'Önce konteyner numarasını yazın (ör. MSDU6983219).';
    return;
  }
  const items = queue;
  for (const item of items) {
    item.container = item.container || typed;
    persist(item);   // konteyner bilgisiyle kaydedilir; uygulama kapansa da kaldığı yerden devam eder
  }
  queue = [];
  uploadAll(items);
});

$('retryBtn').addEventListener('click', () => {
  if (busy || failed.length === 0) return;
  uploadAll(failed.slice());
});

// ---- Yönetici paneli ----
let adminToken = null;

function showOnly(sectionId) {
  for (const id of ['login', 'adminLogin', 'admin']) $(id).classList.toggle('hidden', id !== sectionId);
}

function adminMessage(text, isError) {
  $('adminMsg').className = isError ? 'err' : 'ok';
  $('adminMsg').textContent = text;
}

function renderUsers(users) {
  const list = $('adminUsers');
  list.textContent = '';
  for (const user of users) {
    const row = document.createElement('div');
    row.className = 'userRow';

    const title = document.createElement('div');
    title.style.fontWeight = '600';
    title.textContent = `${user.name} · PIN: ${user.pin}${user.blocked ? ' · ⛔ engelli' : ''}`;

    const blockBtn = document.createElement('button');
    blockBtn.className = 'secondary';
    blockBtn.textContent = user.blocked ? 'Engeli kaldır' : 'Engelle';
    blockBtn.addEventListener('click', () => runAdmin(
      { action: 'adminSetBlocked', pin: user.pin, blocked: !user.blocked },
      user.blocked ? `${user.name} için engel kaldırıldı` : `${user.name} engellendi`
    ));

    const pinBtn = document.createElement('button');
    pinBtn.className = 'secondary';
    pinBtn.textContent = 'PIN değiştir';
    pinBtn.addEventListener('click', () => {
      if (!confirm(`${user.name} için yeni PIN oluşturulsun mu? Eski PIN hemen geçersiz olur.`)) return;
      runAdmin({ action: 'adminChangePin', pin: user.pin }, `${user.name} için yeni PIN oluşturuldu`);
    });

    const buttons = document.createElement('div');
    buttons.className = 'btns';
    buttons.append(blockBtn, pinBtn);
    row.append(title, buttons);
    list.appendChild(row);
  }
}

async function runAdmin(payload, okText) {
  try {
    const result = await callScript({ ...payload, token: adminToken });
    if (!result.ok) throw new Error(result.error || 'İşlem başarısız');
    renderUsers(result.users);
    adminMessage(okText, false);
    return true;
  } catch (error) {
    adminMessage(error.message, true);
    return false;
  }
}

$('adminOpenBtn').addEventListener('click', () => showOnly('adminLogin'));
$('adminBackBtn').addEventListener('click', () => showOnly('login'));

$('adminLoginBtn').addEventListener('click', async () => {
  $('adminLoginMsg').textContent = '';
  try {
    const result = await callScript({ action: 'adminLogin', user: $('adminUser').value.trim(), password: $('adminPass').value });
    if (!result.ok) throw new Error(result.error || 'Giriş başarısız');
    adminToken = result.token;
    $('adminPass').value = '';
    showOnly('admin');
    await runAdmin({ action: 'adminList' }, '');
  } catch (error) {
    $('adminLoginMsg').textContent = error.message;
  }
});

$('adminAddBtn').addEventListener('click', async () => {
  const added = await runAdmin(
    { action: 'adminAdd', name: $('newName').value.trim(), pin: $('newPin').value.trim() },
    'Kullanıcı eklendi'
  );
  if (added) {
    $('newName').value = '';
    $('newPin').value = '';
  }
});

$('adminLogoutBtn').addEventListener('click', () => {
  adminToken = null;
  $('adminUsers').textContent = '';
  adminMessage('', false);
  showOnly('login');
});

// ---- Başlangıç ----
(async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  const saved_items = await dbRun('readonly', (store) => store.getAll());
  for (const record of saved_items) {
    queue.push({ ...record, file: null, prepared: null });
  }
  if (queue.length > 0) {
    $('status').className = 'err';
    $('status').textContent = `⏳ Önceki yüklemeden ${queue.length} fotoğraf bekliyor. Devam etmek için Gönder'e basın.`;
  }
  refreshSelection();
  const saved = load('pin');
  if (saved) {
    try { await enter(saved); return; } catch {}
  }
  $('login').classList.remove('hidden');
})();
